- num: 2092
  speaker: الحارث بن قيس الجعفي
  title: قال الحارث بن قيس الجعفي رحمه الله
  text: 'إذا كنت في أمر الآخرة فتمكث وإذا كنت في أمر الدنيا فتوخ وإذا هممت بخير فلا تؤخره وإذا أتاك الشيطان وأنت تصلي فقال: إنك ترائي فزدها طولا'
  raw: 'إذا كنت في أمر الآخرة فتمكث وإذا كنت في أمر الدنيا فتوخ ms379 وإذا هممت بخير فلا تؤخره وإذا أتاك الشيطان وأنت تصلي فقال: إنك ترائي فزدها طولا'
  source: الزهد للإمام أحمد · رقم ٢٠٩٢ · ط. دار الكتب العلمية ١٤٢٠هـ
