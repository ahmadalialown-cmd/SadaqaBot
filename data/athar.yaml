  raw: 'تذكرت ما جماع الخير فإذا الخير كثير: الصوم والصلاة وإذا هو في يد الله عز وجل وإذا أنت لا تقدر على ما في يد الله عز وجل إلا أن تسأله فيعطيك، فإذا جماع الخير الدعاء'
