- num: 201
  speaker: الحسن البصري
  title: قال الحسن البصري رحمه الله
  text: 'والله لقد أدركت أقواما لو شاء أحدهم أن يأخذ هذا المال من حله أخذه، فيقال لهم: ألا تأتون نصيبكم من هذا المال فتأخذونه حلالا؟ فيقولون: لا، إنا نخشى أن يكون أخذه فسادا لقلوبنا'
  raw: 'والله لقد أدركت أقواما لو شاء أحدهم أن يأخذ هذا المال من حله أخذه، فيقال لهم: ألا تأتون نصيبكم من هذا المال فتأخذونه حلالا؟ فيقولون: لا، إنا نخشى أن يكون أخذه فسادا لقلوبنا'
  source: الزهد للإمام أحمد · رقم ٢٠١ · ط. دار الكتب العلمية ١٤٢٠هـ
