- num: 1872
  speaker: مالك بن دينار
  title: قال مالك بن دينار رحمه الله
  text: 'كم من رجل يحب أن يلقى أخاه وأن يزوره فيمنعه من ذلك الشغل أو الأمر يعرض عسى الله أن يجمع بينهما في دار لا فرقة فيها، ثم يقول مالك: وأنا أسأل الله أن يجمع بيننا وبينكم في ظل طوبى ومستراح العابدين'
  raw: 'كم من رجل يحب أن يلقى أخاه وأن يزوره فيمنعه من ذلك الشغل أو الأمر يعرض عسى الله أن يجمع بينهما في دار لا فرقة فيها، ثم يقول مالك: وأنا أسأل الله أن ms336 يجمع بيننا وبينكم في ظل طوبى ومستراح العابدين'
