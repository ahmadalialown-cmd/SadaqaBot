  text: طوبى لمن نظر في عيبه عن عيب غيره، طوبى لمن تواضع لله من غير مسكنة ورحم أهل الذل والمسكنة وتصدق بمال جمع من غير معصية وجالس أهل العلم والحلم والحكمة، ووسعته السنة ولم يتعدها إلى البدعة
  raw: طوبى لمن نظر في عيبه عن عيب غيره، طوبى لمن تواضع لله من غير مسكنة ورحم أهل الذل والمسكنة وتصدق بمال جمع من غير معصية وجالس أهل العلم والحلم والحكمة، ووسعته السنة ولم يتعدها إلى البدعة
