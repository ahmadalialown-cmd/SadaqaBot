# ===== SadaqaBot settings =====
# Master switch: true = nothing is published, whatever else is set.
#   THE ONE SWITCH: set `paused: true` to stop everything (publishing, API calls, reports).
paused: false

# Calm restart (2026-11-12): exactly one publish per slot per day, nothing extra:
#   أذكار الصباح story after Fajr, أذكار المساء story after Asr, the athar feed post at Maghrib,
#   أذكار النوم story at 22:00; Fridays also the Asr salawat post, and Maghrib = dua for Saud.
#   No reels, no story bursts, no Facebook cross-post. Overrides the warm-up ramp below.
calm: true
calm_max_per_day: 5

# Warm-up after the account locks of 2026-11-07 (fully automatic, no input needed):
#   from start_date: week 1 = 1 post/day (Maghrib feed), week 2 = 2/day (+ daily reel),
#   then the full schedule. Nothing at all (not even API calls) happens before start_date.
warmup:
  start_date: "2026-11-10"
  per_run_posts: 1        # feed/reel posts per 30-min run
  per_run_stories: 6      # story frames per run (stories spread over ~2 hours)
  gap_post_s: 90          # spacing between publishes in one run
  gap_story_s: 20
  max_per_day: 60         # full-schedule daily cap
  api_cap: 60             # never go above this many publishes per 24h (Meta allows 100)

# true = every item in the bank is published without a manual review.
# Turned on 2026-11-07 at the user's request after they approved week 1.
# All content comes from verified sources and passes tests/test_content.py.
auto_approve: true

# The ONLY account this bot may publish to (username, without @). Display name: «صَدقة».
instagram_username: "9d8h0garyh"
# Bridge Facebook Page (hidden, only used for API access); id 61596428126472
facebook_page_name: "صدقة جارية"
deceased_name: "سعود القحطاني"
timezone: "Asia/Qatar"

# Story times (minutes after the prayer); sleep adhkar at a fixed time
morning_after_fajr_min: 20
evening_after_asr_min: 20
sleep_time: "22:00"
friday_asr_post_after_min: 30

# Adhkar stories = the account's OWN adhkar carousel posts, re-published slide by slide as
# story frames (the API can't do the native "share post to story" sticker).
adhkar_posts:
  morning: "18201469900376299"   # أذكار الصباح (20 slides)
  evening: "18091351205228272"   # أذكار المساء (13 slides)
  sleep: "18634968520046922"     # أذكار النوم (16 slides)

# Reels: 1 per day (set 2 to add the athar of the day as a second reel at reel_time_2)
reels_per_day: 1
reel_time: "20:30"
reel_time_2: "13:00"

# Cross-posting (same approval applies). Facebook uses the stored Page token.
crosspost:
  facebook: false   # off for the calm restart (2026-11-12); token has pages_manage_posts
  threads: false    # needs one-time Threads auth
  youtube: false    # needs one-time Google OAuth

# Don't publish an item more than this many minutes late (e.g. after an outage)
max_late_minutes: 90
max_late_minutes_stories: 240

hashtags: "#صدقة_جارية #سعود_القحطاني #ذكر #قرآن"
