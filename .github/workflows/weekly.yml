name: weekly-report

# Fridays 13:30 Doha (10:30 UTC), after Jumu'ah
on:
  schedule:
    - cron: "30 10 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pyyaml requests pillow hijridate==2.6.0
      - name: report
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: cd bot && python weekly_report.py
      - name: save
        run: |
          git config user.name "sadaqabot"
          git config user.email "sadaqabot@users.noreply.github.com"
          git add report_AR.md reports data/optimizer.json
          git diff --cached --quiet || (git commit -m "weekly report" && git pull --rebase && git push)
